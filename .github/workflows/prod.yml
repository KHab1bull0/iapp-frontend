name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Buildx with the GitHub Actions cache: unchanged layers (the nginx base,
      # npm ci in the build stage) are reused, so builds are faster and the
      # server only downloads the layers that really changed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/iapp_front:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          # set -e: a failed pull fails the deploy. Before, a pull that failed
          # went unnoticed and the container was recreated from the old image
          # while the run still showed success.
          script: |
            set -e
            cd ~/iapp
            IMAGE=${{ secrets.DOCKER_USERNAME }}/iapp_front:latest
            # Docker Hub can be slow or drop the connection from here: retry.
            for i in 1 2 3; do
              docker pull "$IMAGE" && break
              if [ "$i" = 3 ]; then echo "pull failed 3 times"; exit 1; fi
              echo "pull failed, retrying ($i)"; sleep 10
            done
            docker stop iapp_front || true
            docker rm iapp_front || true
            docker compose up -d --no-deps front
            # The container must be running the image just pulled.
            if [ "$(docker inspect -f '{{.Image}}' iapp_front)" != "$(docker image inspect -f '{{.Id}}' "$IMAGE")" ]; then
              echo "iapp_front is not running the new image"; exit 1
            fi
            # Tidying only: the other repo's deploy may be pruning at the same
            # moment ("a prune operation is already running"), which must not
            # fail a deploy that already succeeded.
            docker image prune -f || echo "prune skipped"

      - name: Log Success
        run: echo "Frontend deployed successfully"
